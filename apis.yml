aid: tranched
name: Tranched
description: Tranched is a London-based fintech building an embedded, on-chain securitisation
  platform that connects fintech lenders and loan originators directly to professional
  investors. Its "Deep Tokenisation" approach represents loans as on-chain tokens governed
  by Smart Loan Agreements and automated waterfall contracts, letting originators structure
  and launch institutional-grade asset-based financing transactions up to 90% faster and
  at lower cost than traditional securitisation, with automated compliance, reporting, and
  monitoring. Tranched connects to a lender's loan management system via API integration to
  retrieve the data required for assigning and monitoring loans. Founded in 2023 by Clement
  Larrue and Michael Elalouf, the company raised a $3.4M pre-seed round led by Speedinvest
  in November 2024.
